services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:-music_ai}
    # Production: PostgreSQL is only reachable from the compose internal
    # network (`api` and `worker`).  If you need host access for
    # diagnostics, uncomment the ports block below and set
    # POSTGRES_PORT=5432 in your .env — but never in production.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-music_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    # Broker + result backend for Celery.  The `api` and `worker` services
    # talk to it over the compose network.
    #
    # Production: Redis is internal-only and requires a password.  If you
    # need host access for diagnostics, uncomment the ports block below
    # and set REDIS_PORT=6379 in your .env — but never in production.
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:?err}"
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?err}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?err}
      DB_NAME: ${POSTGRES_DB:-music_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD:?err}@redis:6379/0
      STORAGE_DIR: /app/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_storage:/app/storage
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-2.0}"
          memory: ${API_MEMORY:-1g}
        reservations:
          memory: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    # Celery consumer. No HTTP port; only logs. Reuses the same image as
    # the API; only the entrypoint differs.
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?err}
      DB_NAME: ${POSTGRES_DB:-music_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD:?err}@redis:6379/0
      STORAGE_DIR: /app/storage
    volumes:
      - backend_storage:/app/storage
    command: ["celery", "-A", "app.celery_app:celery", "worker", "--loglevel=info", "--concurrency=2"]
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-2.0}"
          memory: ${WORKER_MEMORY:-4g}
        reservations:
          memory: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  backend_storage:
  redis_data: