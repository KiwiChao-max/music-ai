services:
  postgres:
    # Pinned to a concrete patch release (16.12-alpine); bump deliberately
    # after reviewing release notes. Avoids silent major/minor drift.
    image: postgres:16.12-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:-music_ai}
    # Production: PostgreSQL is only reachable from the compose internal
    # network (`api` and `worker`).  If you need host access for
    # diagnostics, uncomment the ports block below and set
    # POSTGRES_PORT=5432 in your .env --- but never in production.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-music_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-1.0}"
          memory: ${POSTGRES_MEMORY:-1g}
        reservations:
          memory: 256m

  redis:
    # Broker + result backend for Celery.  The `api` and `worker` services
    # talk to it over the compose network.
    #
    # Production: Redis is internal-only and requires a password.  If you
    # need host access for diagnostics, uncomment the ports block below
    # and set REDIS_PORT=6379 in your .env --- but never in production.
    # Pinned to the 7.4 minor line; patch releases track automatically
    # within 7.4-alpine (security fixes) without major-version drift.
    image: redis:7.4-alpine
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:?err}"
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?err}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-0.5}"
          memory: ${REDIS_MEMORY:-512m}
        reservations:
          memory: 128m

  # ---------------------------------------------------------------------
  # MinIO --- S3-compatible object storage (optional, for production).
  #
  # Uncomment this block and set ``STORAGE_BACKEND=s3`` in .env to
  # decouple the API and worker from a shared volume.  With MinIO,
  # each container talks to the storage service over the compose
  # network --- no shared mount needed.
  #
  # Lifecycle policy: configure a bucket lifecycle rule in the MinIO
  # console (or via mc admin) to auto-delete objects older than N days.
  # For MinIO, use:
  #
  #   mc ilm rule add --expire-days 30 music-ai/uploads/
  #   mc ilm rule add --expire-days 30 music-ai/outputs/
  #
  # For AWS S3, use the console or CloudFormation/Terraform.
  # ---------------------------------------------------------------------
  # minio:
  #   image: minio/minio:RELEASE.2024-12-11T06-41-27Z
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?err}
  #   ports:
  #     - "${MINIO_API_PORT:-9000}:9000"
  #     - "${MINIO_CONSOLE_PORT:-9001}:9001"
  #   volumes:
  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  api:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?err}
      DB_NAME: ${POSTGRES_DB:-music_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD:?err}@redis:6379/0
      STORAGE_DIR: /app/storage
      # Storage backend: ``local`` (default) or ``s3``.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-music-ai}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_LIFECYCLE_DAYS: ${STORAGE_LIFECYCLE_DAYS:-0}
      # Auth: JWT_SECRET is REQUIRED (no fallback inside containers ---
      # never sign tokens with the dev default).  Set PRODUCTION_MODE=true
      # in production; it enforces non-default secrets and forces auth.
      JWT_SECRET: ${JWT_SECRET:?err}
      PRODUCTION_MODE: ${PRODUCTION_MODE:-false}
      # Logging configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
    # The API is exposed on the host for direct debugging / tools like
    # curl / Swagger UI.  The frontend nginx proxies /api/* to this
    # service over the internal compose network.
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_storage:/app/storage
    # Use Gunicorn as process manager with multiple uvicorn workers for
    # production concurrency.  Migrations run first, then Gunicorn spawns
    # ``API_WORKERS`` (default: 2) uvicorn worker processes behind a
    # preload model.  The single-uvicorn CMD in the Dockerfile is kept
    # for direct ``docker run`` debugging.
    command: >
      sh -c "alembic upgrade head &&
      gunicorn app.main:app
      -w ${API_WORKERS:-2}
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8000
      --timeout 600
      --graceful-timeout 30
      --keepalive 5
      --proxy-headers
      --forwarded-allow-ips='*'
      --access-logfile -
      --error-logfile -"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-2.0}"
          memory: ${API_MEMORY:-1g}
        reservations:
          memory: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  # ---------------------------------------------------------------------
  # Worker: heavy audio pipeline (Demucs / Basic Pitch / ADTOS).
  #
  # Consumes the ``audio_heavy`` queue.  Concurrency is *not* hard-coded;
  # the worker probes CPU / memory / GPU at startup and computes a safe
  # value automatically (see ``worker_probe.py``).  Set
  # ``WORKER_CONCURRENCY`` to a positive integer to override.
  #
  # Memory protection (three layers):
  #   1. Pre-task gate (``WORKER_MEMORY_GATE_MB``) --- rejects task if RSS
  #      is already too high, re-queues to a fresh child.
  #   2. Post-task recycling (``WORKER_MAX_MEMORY_PER_CHILD_MB``) ---
  #      gracefully replaces bloated children after the task finishes.
  #   3. Max-tasks-per-child (``WORKER_MAX_TASKS_PER_CHILD``) ---
  #      forced recycling after N tasks, belt-and-suspenders.
  #
  # GPU: set ``DEMUCS_DEVICE=cuda`` and uncomment the ``deploy`` block
  # below.  Requires nvidia-container-toolkit on the host.
  # ---------------------------------------------------------------------
  worker-heavy:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?err}
      DB_NAME: ${POSTGRES_DB:-music_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD:?err}@redis:6379/0
      STORAGE_DIR: /app/storage
      # Storage backend: ``local`` (default) or ``s3``.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-music-ai}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      # Worker resource tuning (override via .env).
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-0}
      WORKER_MAX_MEMORY_PER_CHILD_MB: ${WORKER_MAX_MEMORY_PER_CHILD_MB:-3500}
      WORKER_MEMORY_GATE_MB: ${WORKER_MEMORY_GATE_MB:-3000}
      WORKER_MAX_TASKS_PER_CHILD: ${WORKER_MAX_TASKS_PER_CHILD:-10}
      # Device placement.
      DEMUCS_DEVICE: ${DEMUCS_DEVICE:-auto}
      BASIC_PITCH_DEVICE: ${BASIC_PITCH_DEVICE:-cpu}
      ADT_DEVICE: ${ADT_DEVICE:-cpu}
      # Same auth settings as `api`: workers validate config at startup
      # too, so JWT_SECRET / PRODUCTION_MODE must stay consistent.
      JWT_SECRET: ${JWT_SECRET:?err}
      PRODUCTION_MODE: ${PRODUCTION_MODE:-false}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
    # When using S3 storage, the shared volume is not needed but kept
    # for the worker's temp download directory.  Remove this volume
    # mount and use a tmpfs instead for pure S3 deployments.
    volumes:
      - backend_storage:/app/storage
    command: >
      celery -A app.celery_app:celery worker
      --loglevel=info
      --queues=audio_heavy
      --hostname=heavy@%h
    healthcheck:
      # Verify the worker process is alive and can reach Redis (broker
      # ping via ``celery inspect ping`` requires a running worker and
      # a responsive broker; ``-d heavy@$$HOSTNAME`` targets our own
      # worker to avoid cross-talk with other containers).
      test: ["CMD-SHELL", "celery -A app.celery_app:celery inspect ping -d heavy@$$(hostname) --timeout=5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${WORKER_HEAVY_CPUS:-4.0}"
          memory: ${WORKER_HEAVY_MEMORY:-8g}
        reservations:
          cpus: "${WORKER_HEAVY_RESERVE_CPUS:-2.0}"
          memory: ${WORKER_HEAVY_RESERVE_MEMORY:-4g}
      # Uncomment for GPU support:
      #   resources:
      #     reservations:
      #       devices:
      #         - driver: nvidia
      #           count: 1
      #           capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 120s

  # ---------------------------------------------------------------------
  # Worker: lightweight tasks (health checks, future housekeeping).
  #
  # Consumes the ``celery`` default queue.  High concurrency is safe
  # because these tasks are short-lived and low-memory.
  # ---------------------------------------------------------------------
  worker-light:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?err}
      DB_NAME: ${POSTGRES_DB:-music_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD:?err}@redis:6379/0
      STORAGE_DIR: /app/storage
      # Storage backend: ``local`` (default) or ``s3``.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-music-ai}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      # Light workers don't need the heavy models --- keep concurrency
      # modest but higher than the heavy worker.
      WORKER_CONCURRENCY: ${WORKER_LIGHT_CONCURRENCY:-4}
      # Same auth settings as `api` (see comment there).
      JWT_SECRET: ${JWT_SECRET:?err}
      PRODUCTION_MODE: ${PRODUCTION_MODE:-false}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
    volumes:
      - backend_storage:/app/storage
    command: >
      celery -A app.celery_app:celery worker
      --loglevel=info
      --queues=celery
      --hostname=light@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery inspect ping -d light@$$(hostname) --timeout=5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${WORKER_LIGHT_CPUS:-1.0}"
          memory: ${WORKER_LIGHT_MEMORY:-512m}
        reservations:
          memory: 128m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  # ---------------------------------------------------------------------
  # Celery Beat --- periodic task scheduler.
  #
  # Runs scheduled cleanup tasks:
  #   - purge_expired_tokens: removes stale refresh-token rows daily
  #   - cleanup_old_tasks: removes on-disk artifacts for finished tasks
  #     older than 30 days
  #
  # Beat stores its schedule database in /tmp (ephemeral) so multiple
  # replicas cannot race --- always run exactly ONE beat instance.
  # ---------------------------------------------------------------------
  celery-beat:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?err}
      DB_NAME: ${POSTGRES_DB:-music_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD:?err}@redis:6379/0
      STORAGE_DIR: /app/storage
      # Same auth settings as `api` (see comment there).
      JWT_SECRET: ${JWT_SECRET:?err}
      PRODUCTION_MODE: ${PRODUCTION_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
    command: >
      celery -A app.celery_app:celery beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    volumes:
      - backend_storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          memory: 64m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s

  # ---------------------------------------------------------------------
  # Frontend: React SPA served by nginx
  #
  # Multi-stage build: Stage 1 compiles the React app with Node 20,
  # Stage 2 serves the static files with nginx:alpine and reverse-proxies
  # /api/* to the `api` service over the internal compose network.
  # ---------------------------------------------------------------------
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
        reservations:
          memory: 32m

volumes:
  postgres_data:
  backend_storage:
  redis_data:
  # minio_data:  # uncomment when using S3 storage backend
