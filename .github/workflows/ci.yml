name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Don't run more than one of these in parallel on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Quick lint/format/type-check gate — runs BEFORE the heavier test jobs
  # so feedback is fast on PRs.
  # ---------------------------------------------------------------------------
  backend-lint:
    name: backend · ruff + mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check app/
      - name: Ruff format check
        run: ruff format --check app/
      - name: Mypy type check
        run: mypy app/

  frontend-lint:
    name: frontend · eslint + prettier + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # Test suites — depend on lint passing
  # ---------------------------------------------------------------------------
  backend:
    name: backend · pytest
    needs: [backend-lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      AUTH_REQUIRED: "false"
      TEST_DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/music_ai_test
      DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/music_ai_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-jwt-secret-do-not-use-in-prod
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: music_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d music_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run pytest
        env:
          PASSLIB_BCRYPT_FORCE_BACKEND: pure-python
        run: pytest -q --tb=short --maxfail=3

  frontend:
    name: frontend · vitest + build
    needs: [frontend-lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test
      - name: Build
        run: npm run build
