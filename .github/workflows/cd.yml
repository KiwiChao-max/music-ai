name: cd

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write     # needed to push to GHCR

jobs:
  # ---------------------------------------------------------------------------
  # Build & push multi-stage Docker images to GitHub Container Registry.
  # Tagged commits (vX.Y.Z) produce immutable versioned images.
  # Pushes to main produce a rolling :latest tag.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: build & push images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Backend image (api + worker share the same image) -----------------
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Frontend image ----------------------------------------------------
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy (optional — uncomment and configure the secrets below to enable
  # automatic zero-downtime deploy on every push to main / version tag).
  #
  # Required repository secrets:
  #   DEPLOY_HOST       - e.g. deploy@your-server.com
  #   DEPLOY_SSH_KEY    - private SSH key with access to DEPLOY_HOST
  #   DEPLOY_PATH       - remote path where docker-compose.yml lives (e.g. /opt/music-ai)
