name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e · upload -> process -> detail
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: music_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      APP_ENV: test
      AUTH_REQUIRED: "false"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/music_ai
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: e2e-jwt-secret
      CORS_ORIGINS: "http://127.0.0.1:4173,http://127.0.0.1:5173,http://localhost:5173"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock.txt
            backend/requirements-dev.lock.txt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run alembic migrations
        working-directory: backend
        run: |
          alembic upgrade head
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        env:
          # Point the built SPA at the backend API.
          VITE_API_BASE_URL: http://127.0.0.1:8000/api
        run: npm run build
      - name: Start backend
        working-directory: backend
        env:
          APP_ENV: test
          AUTH_REQUIRED: "false"
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/music_ai
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: e2e-jwt-secret
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/backend.log 2>&1 &
          echo "backend pid: $!"
      - name: Start frontend
        working-directory: frontend
        run: |
          npx serve dist -s -l 4173 \
            > /tmp/frontend.log 2>&1 &
          echo "frontend pid: $!"
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/healthz >/dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to start; logs:" >&2
          cat /tmp/backend.log >&2
          exit 1
      - name: Wait for frontend
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://127.0.0.1:4173/ >/dev/null; then
              echo "frontend is up"
              exit 0
            fi
            sleep 1
          done
          echo "frontend failed to start; logs:" >&2
          cat /tmp/frontend.log >&2
          exit 1
      - name: Run Playwright e2e tests
        working-directory: frontend
        env:
          PLAYWRIGHT_API_BASE_URL: http://127.0.0.1:8000
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7